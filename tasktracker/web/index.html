<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Task Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237B68EE'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="logo">✓</span><span>TaskTracker</span></div>
    <button class="workspace" id="workspaceBtn" title="Rename workspace"><span class="ws-dot">✳</span><span id="workspaceName">My Workspace</span><span class="caret">▾</span></button>
    <div class="search"><span class="ico">⌕</span><input id="search" placeholder="Search tasks  (Ctrl+K)" autocomplete="off"></div>
    <div class="top-actions">
      <button class="btn ghost" id="openDataBtn" title="Open the folder with tasks.json / tasks.csv / tasks.xlsx">📁 Data files</button>
      <button class="btn primary" id="importBtn">⇪ Import</button>
    </div>
  </header>

  <div class="body">
    <nav class="rail">
      <button class="rail-btn active" data-nav="home"><span>⌂</span>Home</button>
      <button class="rail-btn" data-nav="list"><span>☰</span>Tasks</button>
      <button class="rail-btn" data-nav="calendar"><span>▦</span>Calendar</button>
      <button class="rail-btn" data-nav="import"><span>⇪</span>Import</button>
    </nav>

    <aside class="sidebar">
      <div class="side-title">Views</div>
      <div id="periodNav"></div>
      <div class="side-title row">Lists <button class="icon-btn" id="addListBtn" title="New list">＋</button></div>
      <div id="listNav"></div>
      <div class="side-foot" id="dataPath"></div>
    </aside>

    <main class="main">
      <div class="main-head">
        <div class="crumb"><span class="crumb-ico" id="crumbIco">◎</span><h1 id="viewTitle">Everything</h1></div>
        <div class="tabs" id="tabs">
          <button data-view="home">⌂ Planner</button>
          <button data-view="list">☰ List</button>
          <button data-view="board">▥ Board</button>
          <button data-view="calendar">▦ Calendar</button>
        </div>
      </div>
      <div class="toolbar">
        <div class="chips" id="periodChips"></div>
        <div class="spacer"></div>
        <select id="prioFilter" class="sel" title="Filter by priority">
          <option value="">All priorities</option><option value="urgent">Urgent</option><option value="high">High</option><option value="normal">Normal</option><option value="low">Low</option>
        </select>
        <label class="toggle"><input type="checkbox" id="showDone"> Show completed</label>
        <button class="btn primary" id="newTaskBtn">＋ Task</button>
      </div>
      <div class="content" id="content"></div>
    </main>

    <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  </div>
</div>

<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
